<!DOCTYPE html>
<html>
<head>
<h1>CSS ANIMATIONS</h1>
<style>
div {
width: 100px;
height: 100px;
background-color: black;
animation-name: allu;
animation-duration: 5s;
}
@keyframes allu{
    from{background-color: black;}
    to{background-color: orange}
}
h1{
    text-align: center
}
</style>
</head>
<body>
<div></div>
</body>
</html>
